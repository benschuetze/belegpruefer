name: Eval

# Calls the real model and costs money: only by hand.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Argumente für pnpm eval, z. B. --variante 4 --limit 30"
        required: false
        default: ""
      pdf:
        description: "Auch das Extraktions-Eval mit den 20 PDFs (etwa 0,40 $)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Two calls first: a wrong key, workspace or model id fails here for a fraction of a cent.
      - run: pnpm smoke:ai
      # Input via env, never interpolated into the script: no shell injection through the dispatch form.
      - run: pnpm eval $EVAL_ARGS | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          EVAL_ARGS: ${{ inputs.args }}
      - if: inputs.pdf
        run: pnpm eval:pdf
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-ergebnis
          path: |
            evals/ergebnis.json
            evals/runs/
