name: CI

on:
  # Branches run once via their PR, main once after merge, not twice.
  push:
    branches: [main]
  pull_request:
  # Weekly, so a newly published advisory is noticed even when nobody touches the code.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Everything that ships to the server must be free of known high/critical advisories.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm security:osv
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway container reachable only from this job; no credential to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: belegpruefer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/belegpruefer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Agent changes need a measurement before merge; CI cannot run it (it costs credits), so it says so on the PR.
  eval-hint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Agenten oder Eval geändert?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(app/lib/agents/|evals/)'; then
            echo "::warning title=Eval vor Merge ausführen::Dieser PR ändert app/lib/agents/** oder evals/**. Vor dem Merge pnpm eval laufen lassen (Workflow „Eval“, manuell) und das Ergebnis in den PR schreiben."
            echo "### Eval vor Merge ausführen" >> "$GITHUB_STEP_SUMMARY"
          fi
